<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15110d" />
  <title>Perfil | CHAMA</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">
      <span class="logo-flame">🔥</span>
      CH<span>AMA</span>
    </a>
    <nav>
      <a href="index.html">Início</a>
      <a href="servicos.html">Serviços</a>
      <a href="perfil.html">Perfil</a>
    </nav>
  </header>

  <main class="profile-wrap">
    <section class="profile-card corner-card">
      <div class="profile-avatar" id="profileInitial">?</div>

      <h1>Meu perfil</h1>
      <p class="lead">Usuário conectado</p>

      <div class="profile-email" id="usuario">Carregando...</div>

      <div class="profile-list">
        <div class="profile-list-item">
          <span>Solicitações enviadas</span>
          <strong>0</strong>
        </div>
        <div class="profile-list-item">
          <span>Categoria favorita</span>
          <strong>Elétrica</strong>
        </div>
        <div class="profile-list-item">
          <span>Cidade</span>
          <strong>Curitiba, PR</strong>
        </div>
      </div>

      <button class="btn-secondary" onclick="logout()">Sair da conta</button>
    </section>
  </main>

  <footer class="footer">CHAMA Serviços — protótipo de estudo, sem back-end real.</footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
